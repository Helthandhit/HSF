<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Street Fitness | Membership</title>
    <style>
        :root {
            --brand-green: #8cc63f;
            --brand-teal: #00a99d;
            --brand-blue: #0056b3;
            --dark-gray: #4a4a4a;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; color: var(--dark-gray); background-color: #f9f9f9; }

        /* Header */
        header { padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; background: white; border-bottom: 2px solid #eee; }
        .logo { height: 60px; }
        nav a { margin-left: 20px; text-decoration: none; color: var(--dark-gray); font-weight: bold; font-size: 0.9em; }

        /* Membership Section */
        .membership-grid { display: flex; justify-content: center; gap: 30px; padding: 50px 5%; flex-wrap: wrap; }
        .card { width: 320px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; text-align: center; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        
        /* Accents */
        .strip-blue { height: 10px; background: var(--brand-blue); }
        .strip-teal { height: 10px; background: var(--brand-teal); }
        .strip-green { height: 10px; background: var(--brand-green); }

        .content { padding: 25px; }
        .price { font-size: 2.2em; font-weight: bold; margin: 15px 0; color: #333; }
        button { background: var(--brand-green); color: white; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #7ab035; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
        .modal-content { background: white; margin: 5% auto; padding: 30px; width: 90%; max-width: 400px; border-radius: 10px; position: relative; }
        .close { position: absolute; right: 20px; top: 10px; cursor: pointer; font-size: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .checkbox-container { font-size: 0.85em; margin: 10px 0; }
    </style>
</head>
<body>

<header>
    <img src="logo.jpg" alt="High Street Fitness Logo" class="logo">
 <nav>
    <a href="index.html">HOME</a>
    <a href="about_us.html">ABOUT US</a>
    <a href="blog.html">BLOG</a>
    <a href="#">CLASSES</a>
    <a href="#">LOCATIONS</a>
    <a href="#">CONTACT</a>
</nav>
</header>

<section class="membership-grid">
    <div class="card">
        <img src="single.jpg" alt="Single Membership">
        <div class="strip-blue"></div>
        <div class="content">
            <h3>Single 24/7</h3>
            <div class="price">£23 <small style="font-size: 0.4em;">p/m</small></div>
            <button onclick="openModal('Single 24/7')">Join Now</button>
        </div>
    </div>

    <div class="card">
        <img src="couples.jpg" alt="Couples Membership">
        <div class="strip-teal"></div>
        <div class="content">
            <h3>Couples 24/7</h3>
            <div class="price">£35 <small style="font-size: 0.4em;">p/m</small></div>
            <button onclick="openModal('Couples 24/7')">Join Now</button>
        </div>
    </div>

    <div class="card">
        <img src="student.jpg" alt="Student Membership">
        <div class="strip-green"></div>
        <div class="content">
            <h3>Student 24/7</h3>
            <div class="price">£15 <small style="font-size: 0.4em;">p/m</small></div>
            <button onclick="openModal('Student 24/7')">Join Now</button>
        </div>
    </div>
</section>

<div id="enrollModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="planTitle">Membership Signup</h2>
        <form>
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email Address" required>
            <input type="text" placeholder="Full Address" required>
            <input type="tel" placeholder="Phone Number" required>
            <div class="checkbox-container">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the <a href="#">Terms & Conditions</a></label>
            </div>
            <button type="submit" style="width: 100%;">Complete Purchase</button>
        </form>
    </div>
</div>

<script>
    function openModal(plan) {
        document.getElementById('planTitle').innerText = "Joining: " + plan;
        document.getElementById('enrollModal').style.display = 'block';
    }
    function closeModal() {
        document.getElementById('enrollModal').style.display = 'none';
    }
    window.onclick = function(event) {
        if (event.target == document.getElementById('enrollModal')) closeModal();
    }
</script>

</body>
</html>
